config_version = 14

[audio]
enable_sounds = true

[bar]
order = [ "polibar" ]

    [bar.polibar]
    background_opacity = 0.69999998435378075
    center = []
    end = [
        "tray",
        "bluetooth",
        "volume",
        "keyboard_layout",
        "widget",
        "network",
        "battery",
        "notifications",
        "date",
        "bar"
    ]
    font_family = "JetBrainsMono Nerd Font"
    margin_ends = 0
    radius = 0
    radius_bottom_left = 10
    radius_bottom_right = 10
    start = [ "launcher", "control-center", "active_window" ]
    thickness = 32
    widget_spacing = 10

[calendar]
enabled = true

    [calendar.account.personal_google]
    type = "google"

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
auto_hide = true
enabled = true
reserve_space = false
show_dots = true

