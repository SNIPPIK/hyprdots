[notification]
layer = "overlay"

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "niri"

[plugin_settings."yuuto/arch-updater"]
aur_helper = "off"
auto_check_hours = 1
terminal = "alacritty --class hyprdots-float"
update_cmd = "bash ~/.config/niri/sh/pacman/update.sh && bash ~/.config/niri/sh/pacman/unused.sh"

[plugins]
auto_update = "all"
enabled = [ "kenn/keybind-cheatsheet", "yuuto/arch-updater", "raycursive/niri-displays" ]

[shell]
avatar_path = "/home/snippik/.face.icon"
font_family = "JetBrainsMono Nerd Font"
password_style = "random"
polkit_agent = true

    [shell.animation]
    speed = 1.3000000193715096

    [shell.launcher.providers.emoji]
    global = false

    [shell.panel]
    launcher_placement = "attached"
    launcher_position = "auto"
    open_near_click_control_center = true
    open_near_click_launcher = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "qt" ]

[wallpaper.default]
path = "/home/snippik/Pictures/Wallpapers/Static/Nature/[6K] Winter.jpg"

[wallpaper.last]
path = "/home/snippik/Pictures/Wallpapers/Static/Nature/[6K] Winter.jpg"

[wallpaper.monitors.DP-2]
path = "/home/snippik/Pictures/Wallpapers/Static/City/[4K] Fog sity.jpg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/snippik/Pictures/Wallpapers/Static/Nature/[6K] Winter.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/snippik/Pictures/Wallpapers/Static/Nature/[6K] Winter.jpg"

[widget.active_window]
display = "text_only"
title_scroll = "on_hover"

[widget.bar]
show_resolution = false
type = "raycursive/niri-displays:bar"

[widget.battery]
display_mode = "graphic"
hide_when_full = true
show_label = false

[widget.date]
format = "{:%H:%M}"

[widget.keyboard_layout]
hide_when_single_layout = true
show_label = false

[widget.launcher]
font_family = "JetBrainsMono Nerd Font"
glyph = "navigation-filled"

[widget.network]
show_label = false

[widget.tray]
drawer = true

[widget.volume]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"